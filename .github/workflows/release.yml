name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and lint
        run: make test lint

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          project="asana-cli-for-agents"
          binary="asana"
          version="${RELEASE_TAG#v}"
          rm -rf build dist
          mkdir -p build dist

          build_one() {
            local goos="$1"
            local goarch="$2"
            local platform="$3"
            local stem="${project}_${RELEASE_TAG}_${platform}_${goarch}"
            local stage="build/${stem}"
            local output="${stage}/${binary}"

            mkdir -p "${stage}"
            if [[ "${goos}" == "windows" ]]; then
              output="${output}.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "${output}" .
            cp LICENSE NOTICE README.md "${stage}/"
            cp -R docs/. "${stage}/docs/"

            if [[ "${goos}" == "windows" ]]; then
              (cd build && python3 -m zipfile -c "../dist/${stem}.zip" "${stem}")
            else
              tar -C build -czf "dist/${stem}.tar.gz" "${stem}"
            fi
          }

          build_one linux amd64 linux
          build_one linux arm64 linux
          build_one darwin amd64 macos
          build_one darwin arm64 macos
          build_one windows amd64 windows
          build_one windows arm64 windows

          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          elif [[ -f "${notes_file}" ]]; then
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
